name = "claude-rpc-totals"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true
preview_urls = false

# The single KV namespace that holds everything the worker stores (community
# totals, profiles, the leaderboard index, squads, Wrapped, rate-limit
# markers — the key prefixes are listed at the top of src/index.js). Create
# one with:
#   wrangler kv namespace create TOTALS
# and paste the returned `id` below. For local development add a `preview_id`
# from `wrangler kv namespace create TOTALS --preview`.

[[kv_namespaces]]
binding = "TOTALS"
id = "6ca3b87cd4cc46469008d28558701dac"

# Web login (GitHub OAuth). GITHUB_CLIENT_ID is public; the two secrets are
# set out-of-band:
#   wrangler secret put GITHUB_CLIENT_SECRET   (from the GitHub OAuth app)
#   wrangler secret put SESSION_SECRET         (any long random string)
# Register the OAuth app's callback URL as:
#   https://claude-rpc-totals.claude-rpc.workers.dev/auth/callback
[vars]
GITHUB_CLIENT_ID = "Ov23liFCtlBWX8BHepyh"
SITE_ORIGIN = "https://claude-rpc.com"
DISCORD_INVITE = "https://discord.gg/WYJw5JKsNw"
DISCORD_GUILD_ID = "1564964247589355551"
DISCORD_PUBLIC_KEY = "784e8dc63170bc8604f160403d821f5c8f5b49a855da7d01875483428b29db4e"
# Windows, macOS, Linux — the only roles the #roles buttons may toggle
DISCORD_OS_ROLES = "1564966622261673995,1564966694491783228,1564966760841740369"

# Discord bot: invite sync + weekly posts (src/discord-bot.js)
[triggers]
crons = ["*/15 * * * *"]
