# CI on every push and PR — the release workflow only fires on tags, so
# without this, main can sit broken for days and nobody finds out until the
# next release build. Same test matrix as release.yml's gate, plus the static
# checks (lint / typecheck) that release doesn't run at all. format:check is
# deliberately NOT gated: the tree has never been prettier-clean, and a
# 77-file reformat isn't worth the churn until it's done as its own commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install deps
        run: npm ci || npm install
      - name: Run tests
        run: npm test
      - name: Run worker tests
        run: |
          npm --prefix worker ci || npm --prefix worker install
          npm --prefix worker test

  test-windows:
    # Every other job here runs on ubuntu-latest, which never exercises the
    # daemon's Windows-only side effects — the PowerShell process-liveness
    # query, the PowerShell toast notifier, the reg.exe/.vbs autostart entry,
    # and fs.watch's real (unreliable) rename behavior. Those previously went
    # untested until a human ran the release-built .exe. One job, one Node
    # version: enough to catch a real regression without doubling CI cost by
    # matrixing Windows across every Node version too.
    name: Test (Windows, Node 20)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Run tests
        run: npm test

  static:
    name: Lint / format / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
